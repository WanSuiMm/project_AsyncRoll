[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asyncroll"
version = "0.1.0"
description = "GPU-first runtime for tool-using agents"
requires-python = ">=3.10"

[project.scripts]
asyncroll = "asyncroll.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
